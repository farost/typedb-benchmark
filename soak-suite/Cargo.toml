[package]
name = "typedb-soak-suite"
edition = "2024"
version = "0.1.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/bin/runner.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "verify-report"
path = "src/bin/verify-report.rs"

[dependencies]
typedb-driver = "=3.12.0-rc0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
ctrlc = "3"
futures = "0.3"
